<!--?xml version="1.0" encoding="UTF-8"?-->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=windows-1252">
    <title>Homepage</title>
    <style> 
        body { background-color: #ADD8E6; margin: 0; }
        .navbar {
            background-color: #297791;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
        }
        .navbar-links {
            display: flex;
            gap: 15px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 14px 20px;
        }
        .navbar a:hover {
            background-color: #555;
            border-radius: 5px;
        }
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar input[type="text"] {
            padding: 8px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
        }
        .cart-button {
            background-color: #fff;
            color: #297791;
            font-size: 20px;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .cart-button:hover {
            background-color: #555;
            color: white;
        }
        .backg {
            position: relative;
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .backg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px);
        }
        .backg h1 {
            position: absolute;
            color: white;
            font-size: 36px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 5px;
        }
        .button-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 40px 0;
        }
        .button-section button {
            width: 200px;
            height: 100px;
            font-size: 20px;
            background-color: #297791;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }
        .button-section button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>  
    <div class="navbar">
        <div class="navbar-links">
            <a href="index.html">Home</a> 
            <a href="shop.html">Shop</a>
            <a href="merch.html">Discounts</a>
            <a href="social.html">Socials</a>
            <a href="yourPage.html">Your Page</a>

        </div>

        <div class="navbar-right">
            <input type="text" placeholder="Search..."/>
            <a href="login.html"><button class="cart-button">Login</button></a>
            <a href="cart.html"><button class="cart-button">Cart</button></a>

        </div>
    </div>

    <hr />

    <div class="backg">
        <img src="backpic.PNG" alt="backg Image">
        <h1>Welcome To FashionFits Store!</h1>
    </div>
    
    <div class="button-section">
        <a href="eidCollection.html"><button>Eid Collection</button></a>
        <a href="homeWear.html"><button>Home Collection</button></a>
        <a href="merch.html"><button>Discounts</button></a>
    </div>
</body>
</html>
